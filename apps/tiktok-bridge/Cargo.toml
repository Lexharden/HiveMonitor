[package]
name = "tiktok-bridge"
version = "0.1.0"
edition = "2024"
description = "Puente entre HiveMonitor y TikTok LIVE (piratetok-live-rs): emite eventos como JSON por líneas"
license = "MIT"
publish = false

[dependencies]
piratetok-live-rs = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-util", "io-std", "time"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
