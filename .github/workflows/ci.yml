name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Los tests usan este servidor (necesita permisos para crear bases y roles) en vez de PostgreSQL embebido
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test

  rust:
    name: Rust (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Dependencias de Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --filter @hivemonitor/web build # tauri::generate_context! necesita frontendDist
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: tiktok-bridge (fmt + clippy)
        working-directory: apps/tiktok-bridge
        run: |
          sudo apt-get install -y pkg-config libssl-dev
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

  binary:
    name: Binario del servidor
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias del puente
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      # El puente de TikTok se compila para el SO del runner (linux-x64); los demás destinos usan solo el binario principal
      - run: bun scripts/build-binary.ts --targets=linux-x64,linux-arm64,windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: hivemonitor-binarios
          path: dist/*

  image:
    name: Imagen de contenedor
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          push: false
          tags: hivemonitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Instaladores de escritorio (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de Tauri (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: hivemonitor-desktop-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  android:
    name: APK de Android
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Inicializar y compilar (APK sin firmar; ver docs/desktop.md para firmar)
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          bun run tauri android init
          bun run tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: hivemonitor-android
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
