# HiveMonitor detrás de Nginx SIN TLS (HTTP en el puerto 80).
# Úsalo cuando el HTTPS lo termina otra capa delante (Cloudflare, un balanceador, otro Nginx/NPM) o en una red de confianza/local.
# Si esta es la capa pública, usa mejor hivemonitor.conf (con TLS): las cookies de sesión y los tokens viajarían en claro.
#
# Instalación:
#   sudo cp deploy/nginx/hivemonitor-nossl.conf /etc/nginx/conf.d/hivemonitor.conf
#   sudo sed -i 's/hivemonitor.yafel.dev/TU.DOMINIO/g' /etc/nginx/conf.d/hivemonitor.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# .env de HiveMonitor:
#   TRUSTED_PROXIES=127.0.0.1            # IP de este Nginx
#   BASE_URL=https://TU.DOMINIO          # la URL pública (https si hay TLS aguas arriba; http://TU.IP en LAN)

map $http_upgrade $hm_connection_upgrade {
    default upgrade;
    ""      "";
}

# Esquema original: si una capa anterior de confianza ya terminó TLS, respeta su X-Forwarded-Proto.
# Descomenta y ajusta la red de esa capa; si no, se usa el esquema de esta conexión (http).
# geo $hm_trusted_front { default 0; 10.0.0.0/8 1; }
map $http_x_forwarded_proto $hm_proto {
    default $scheme;
    # "https" $http_x_forwarded_proto;   # solo si activas el bloque geo de arriba y lo condicionas a $hm_trusted_front
}

upstream hivemonitor {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hivemonitor.yafel.dev;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://hivemonitor;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Se sobrescribe: HiveMonitor no debe confiar en lo que envíe el cliente
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $hm_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket (moderación)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $hm_connection_upgrade;

        # SSE (tiempo real): sin buffering y con tiempos largos
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
