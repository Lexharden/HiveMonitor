# HiveMonitor detrás de Nginx nativo (sin Nginx Proxy Manager).
# Instalación:
#   sudo cp deploy/nginx/hivemonitor.conf /etc/nginx/conf.d/hivemonitor.conf   (o sites-available + enlace en sites-enabled)
#   sudo sed -i 's/hivemonitor.yafel.dev/TU.DOMINIO/g' /etc/nginx/conf.d/hivemonitor.conf
#   sudo certbot certonly --nginx -d TU.DOMINIO        # genera los certificados referenciados abajo
#   sudo nginx -t && sudo systemctl reload nginx
# En .env de HiveMonitor: BASE_URL=https://TU.DOMINIO  y  TRUSTED_PROXIES=127.0.0.1

# Cabecera Connection según haya o no petición de upgrade (WebSocket de moderación)
map $http_upgrade $hm_connection_upgrade {
    default upgrade;
    ""      "";
}

upstream hivemonitor {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hivemonitor.yafel.dev;

    # Renovación de certificados (certbot --webroot) y redirección a HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hivemonitor.yafel.dev;

    ssl_certificate     /etc/letsencrypt/live/hivemonitor.yafel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hivemonitor.yafel.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # La app ya envía CSP, HSTS, X-Frame-Options, etc.: no se duplican aquí.
    server_tokens off;
    client_max_body_size 1m;   # la API solo recibe JSON pequeño (heartbeat ≤ 8 KB)

    location / {
        proxy_pass http://hivemonitor;
        proxy_http_version 1.1;

        # IP real y esquema: HiveMonitor solo los respeta si el proxy está en TRUSTED_PROXIES
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # se sobrescribe: no se confía en lo que envíe el cliente
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket (moderación)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $hm_connection_upgrade;

        # SSE (tiempo real): sin buffering y con tiempos largos
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
